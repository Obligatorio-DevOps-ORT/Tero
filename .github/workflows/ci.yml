name: CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  gitleaks:
    name: Detección de secretos (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Bajar el código con todo el historial
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Definir qué commits escanear
        id: rango
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "commits=${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "commits=${{ github.event.before }}..${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Escanear con Gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest git /repo \
            --log-opts="${{ steps.rango.outputs.commits }}" --verbose --redact

  build:
    name: Build de ${{ matrix.servicio }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        servicio: [catalog, cart, orders, checkout, ui, admin]
    steps:
      - name: Bajar el código
        uses: actions/checkout@v4

      - name: Construir la imagen de ${{ matrix.servicio }}
        run: docker build -t tero-${{ matrix.servicio }}:${{ github.sha }} ./src/${{ matrix.servicio }}

  terraform:
    name: Terraform (fmt y validate)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - name: Bajar el código
        uses: actions/checkout@v4

      - name: Instalar Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.17.1

      - name: Revisar el formato
        run: terraform fmt -check -recursive -diff

      - name: Inicializar sin backend
        run: terraform init -backend=false

      - name: Validar la configuración
        run: terraform validate