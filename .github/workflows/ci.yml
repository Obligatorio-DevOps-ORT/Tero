name: CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  gitleaks:
    name: Detección de secretos (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Bajar el código con todo el historial
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Definir qué commits escanear
        id: rango
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "commits=${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "commits=${{ github.event.before }}..${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Escanear con Gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest git /repo \
            --log-opts="${{ steps.rango.outputs.commits }}" --verbose --redact

  semgrep:
    name: Análisis estático (Semgrep)
    runs-on: ubuntu-latest
    steps:
      - name: Bajar el código
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Escanear con Semgrep
        run: |
          docker run --rm -v "$PWD:/src" -w /src semgrep/semgrep:1.186.0 \
            semgrep scan --config p/default --metrics=off --error

  trivy:
    name: Dependencias vulnerables (Trivy)
    runs-on: ubuntu-latest
    steps:
      - name: Bajar el código
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Escanear dependencias con Trivy
        run: |
          docker run --rm -v "$PWD:/src" -w /src aquasec/trivy:0.76.2 \
            fs --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 .

  build:
    name: Build de ${{ matrix.servicio }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        servicio: [catalog, cart, orders, checkout, ui, admin]
    steps:
      - name: Bajar el código
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Construir la imagen de ${{ matrix.servicio }}
        run: docker build -t tero-${{ matrix.servicio }}:${{ github.sha }} ./src/${{ matrix.servicio }}

      - name: Configurar credenciales de AWS
        if: github.event_name == 'push'
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Iniciar sesión en ECR
        if: github.event_name == 'push'
        uses: aws-actions/amazon-ecr-login@7290e214a610b32bc0eef81748948b6d466a8783 # v2.2.0

      - name: Publicar la imagen en ECR
        if: github.event_name == 'push'
        run: |
          IMAGEN="${{ vars.ECR_REGISTRY }}/tero-${{ matrix.servicio }}:${{ github.sha }}"
          docker tag tero-${{ matrix.servicio }}:${{ github.sha }} "$IMAGEN"
          docker push "$IMAGEN"

  terraform:
    name: Terraform (fmt y validate)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - name: Bajar el código
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Instalar Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.17.1

      - name: Revisar el formato
        run: terraform fmt -check -recursive -diff

      - name: Inicializar sin backend
        run: terraform init -backend=false

      - name: Validar la configuración
        run: terraform validate

      - name: Validar infra/global
        working-directory: infra/global
        run: |
          terraform init -backend=false
          terraform validate

  terraform-plan:
    name: Terraform plan (${{ matrix.ambiente }})
    if: github.event_name == 'pull_request'
    needs: terraform
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ambiente: [global, dev, test, prod]
    steps:
      - name: Bajar el código
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Instalar Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.17.1

      - name: Configurar credenciales de AWS
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Plan de ${{ matrix.ambiente }}
        env:
          AMBIENTE: ${{ matrix.ambiente }}
        run: |
          if [ "$AMBIENTE" = "global" ]; then
            cd infra/global
            terraform init -input=false
            terraform plan -input=false -lock=false
          else
            cd infra
            terraform init -input=false
            terraform workspace select "$AMBIENTE"
            terraform plan -input=false -lock=false -var-file="envs/$AMBIENTE.tfvars"
          fi